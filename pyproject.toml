[project]
name = "ssh-gui"
version = "0.1.0"
description = "SSH GUI with Finder-like column browser and integrated terminal"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "flask-socketio>=5.3",
    "paramiko>=3.4",
    "pywebview>=6.2.1",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
